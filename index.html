<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1D3A">
<title>부스 체크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --frame:#1A1D3A; --frame-2:#262A52; --frame-text:#FFFFFF; --frame-muted:#A9ADD6;
  --paper:#F3F4F9; --card:#FFFFFF; --text:#171A33; --muted:#686D8F; --line:#E1E3EE;
  --pre:#6C4CF1; --pre-soft:#EEE9FF;
  --on:#F23D6B; --on-soft:#FFE5EC;
  --done:#14A06B; --done-soft:#DCF5E9;
  --star:#E8A800; --danger:#D7263D;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --tabh:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --frame:#12142B; --frame-2:#1F2244; --frame-muted:#9295C0;
    --paper:#1B1E39; --card:#262A4A; --text:#ECEDF8; --muted:#A1A5C8; --line:#363A5E;
    --pre:#A08CFF; --pre-soft:#2E2961; --on:#FF7898; --on-soft:#4B2438;
    --done:#3DD598; --done-soft:#1C4535; --star:#FFC933; --danger:#FF6070;
  }
}
:root[data-theme="dark"]{
  --frame:#12142B; --frame-2:#1F2244; --frame-muted:#9295C0;
  --paper:#1B1E39; --card:#262A4A; --text:#ECEDF8; --muted:#A1A5C8; --line:#363A5E;
  --pre:#A08CFF; --pre-soft:#2E2961; --on:#FF7898; --on-soft:#4B2438;
  --done:#3DD598; --done-soft:#1C4535; --star:#FFC933; --danger:#FF6070;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--frame);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--frame);color:var(--text);font-family:var(--body);
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
input,textarea{font-size:16px}
:focus-visible{outline:3px solid var(--pre);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;background:var(--paper)}

/* Header */
.top{background:var(--frame);color:var(--frame-text);padding:14px 18px 14px;flex:none}
.top-row{display:flex;align-items:center;gap:10px}
.ev-name{display:block;flex:1;min-width:0;font-family:var(--display);font-size:24px;line-height:1.15;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;font-weight:400}
.ev-name.unset{color:var(--frame-muted);font-size:20px}
.dday{flex:none;font-family:var(--display);font-size:18px;background:#FFE14D;color:#1A1D3A;border-radius:10px;padding:5px 10px 4px}
.dday.today{background:var(--on);color:#fff}
.dday.past{background:var(--frame-2);color:var(--frame-muted)}
.ev-sub{font-size:13px;color:var(--frame-muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;margin-top:12px}
.stat{background:var(--frame-2);border-radius:12px;padding:8px 10px}
.stat .k{font-size:12px;color:var(--frame-muted);display:flex;align-items:center;gap:5px}
.stat .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat .v{font-weight:700;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-weight:500;font-size:12px;color:var(--frame-muted)}

/* Main */
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.pad{padding:14px 14px 110px}

/* Tab bar */
.tabbar{flex:none;height:var(--tabh);background:var(--frame);display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;color:var(--frame-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"] svg{color:#FFE14D}

/* Chip bar */
.toolbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;min-width:44px;padding:0 12px;border-radius:18px;border:2px solid var(--line);background:var(--card);
  font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.chip .n{font-weight:500;font-size:12px;color:var(--muted)}
.chip.sec{border-color:var(--sc)}
.chip.sec .dot{width:10px;height:10px;border-radius:3px;background:var(--sc)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--card);border-color:var(--text)}
.chip.sec[aria-pressed="true"]{background:var(--sc);border-color:var(--sc);color:#fff}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}

/* Section group */
.group{margin-bottom:22px}
.ghead{display:flex;align-items:center;gap:10px;margin:4px 2px 10px}
.gletter{font-family:var(--display);font-size:30px;line-height:1;color:var(--sc)}
.gline{flex:1;height:3px;border-radius:2px;background:var(--sc);opacity:.35}
.gcount{font-size:13px;color:var(--muted);font-weight:500}

/* Booth card */
.booth{width:100%;display:flex;align-items:stretch;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:10px;margin-bottom:10px;content-visibility:auto;contain-intrinsic-size:auto 92px;transition:transform .12s ease}
.booth:active{transform:scale(.985)}
.stamp{flex:none;min-width:76px;border-radius:12px;background:var(--sc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 8px 7px;gap:6px}
.stamp b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;letter-spacing:.01em;white-space:nowrap}
.stamp.wide b{font-size:21px}
.seats{display:flex;gap:3px}
.seats em{width:14px;height:6px;border-radius:2px;background:rgba(255,255,255,.95)}
.seats em.off{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75)}
.seats.s2 em{width:10px}.seats.s3 em{width:8px}.seats.s4 em{width:6px;gap:2px}
.seats.s3,.seats.s4{gap:2px}
.mb.multi{background-image:repeating-linear-gradient(90deg,transparent 0 86px,rgba(255,255,255,.55) 86px 88px);background-position:0 0}
.mb.multi.vert{background-image:repeating-linear-gradient(180deg,transparent 0 86px,rgba(255,255,255,.55) 86px 88px)}
.mb.multi.none,.mb.multi.done{background-image:repeating-linear-gradient(90deg,transparent 0 84px,var(--line) 84px 86px)}
.mb.multi.vert.none,.mb.multi.vert.done{background-image:repeating-linear-gradient(180deg,transparent 0 84px,var(--line) 84px 86px)}
.tg{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;line-height:1.5;color:var(--tc);background:var(--tb);border:0;white-space:nowrap}
button.tg{height:30px;font-size:13px;padding:0 11px}
.tg .x{border:0;background:none;color:inherit;width:22px;height:22px;padding:0;margin-right:-6px;font-size:16px;line-height:1;display:grid;place-items:center}
.btags{display:flex;flex-wrap:wrap;gap:4px}
.chip.tagc{border-color:var(--tb);color:var(--tc);font-size:14px}
.chip.tagc[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:#fff}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:7px 8px;min-height:46px}
.tagedit:focus-within{border-color:var(--pre);background:var(--card)}
.tagedit input{flex:1;min-width:110px;border:0;background:none;outline:none;height:30px;padding:0 4px}
.tagsug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tagsug .lbl{font-size:12px;color:var(--muted);align-self:center;margin-right:2px}
.chips.tagrow{margin-top:8px}
.bmain{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.bname{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname.none{color:var(--muted);font-weight:500}
.bmeta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;line-height:1.5}
.tag.pre{background:var(--pre-soft);color:var(--pre)}
.tag.on{background:var(--on-soft);color:var(--on)}
.tag.seat{background:var(--paper);color:var(--muted)}
.tag.must{background:transparent;color:var(--star);padding:2px 2px}
.tag.lnk{background:#DDF1FB;color:#0A6E9E}
.searchrow{display:flex;gap:8px;align-items:center}
.searchrow .search{flex:1;min-width:0}
.tblbtn{flex:none;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:6px;padding:0 12px;font-weight:700;font-size:14px}
.tblbtn svg{width:18px;height:18px}
.linkrow{display:flex;gap:8px;margin-bottom:12px}
.linkrow .btn{height:42px}
.linkrow a.btn{flex:1;min-width:0;text-decoration:none;background:#DDF1FB;color:#0A6E9E;border:0}
.linkrow a.btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.bulk .rn .mini.upd{background:var(--card);color:var(--sc);box-shadow:inset 0 0 0 2px var(--sc)}
.bst.same{background:var(--paper);color:var(--muted)}
.w-link{min-width:210px}
.bmemo{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--done);border-radius:3px}
.bcount{flex:none;align-self:center;text-align:right;font-weight:700;font-size:20px;min-width:42px;font-variant-numeric:tabular-nums;padding-right:4px}
.bcount small{font-size:13px;color:var(--muted);font-weight:500}
.booth.alldone{background:var(--done-soft);border-color:transparent}
.booth.alldone .bcount{color:var(--done)}
.booth.alldone .stamp{opacity:.75}

.empty{text-align:center;color:var(--muted);padding:48px 20px;line-height:1.7}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* FAB */
.fab{position:fixed;right:16px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:20;height:56px;padding:0 22px 0 18px;
  border-radius:28px;border:0;background:var(--pre);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 20px -6px rgba(108,76,241,.6)}
.fab svg{width:22px;height:22px}
.fab:active{transform:scale(.96)}

/* Checklist */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;height:38px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--card)}
.seg button.pre[aria-pressed="true"]{background:var(--pre);color:#fff}
.seg button.on[aria-pressed="true"]{background:var(--on);color:#fff}
.row2{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.toggle{display:flex;align-items:center;gap:8px;border:0;background:none;font-size:14px;font-weight:500;padding:4px 0;color:var(--text)}
.toggle .sw{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-pressed="true"] .sw{background:var(--done)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(16px)}
.money{font-size:13px;color:var(--muted);text-align:right}
.money b{color:var(--text);font-size:15px}

.cgroup{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.chead{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.mini{flex:none;font-family:var(--display);font-size:17px;background:var(--sc);color:#fff;border-radius:8px;padding:5px 8px 4px;line-height:1;white-space:nowrap}
.chead .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .cnt{font-size:13px;color:var(--muted)}

/* Item rows */
.item{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-left:5px solid var(--tc);min-height:60px}
.item + .item{border-top:1px solid var(--line)}
.item.pre{--tc:var(--pre);--tcs:var(--pre-soft)}
.item.on{--tc:var(--on);--tcs:var(--on-soft)}
.ck{flex:none;width:48px;height:48px;border:0;background:none;display:grid;place-items:center;padding:0}
.ck span{width:32px;height:32px;border-radius:50%;border:3px solid var(--tc);display:grid;place-items:center;transition:transform .15s ease,background .15s}
.ck svg{width:18px;height:18px;opacity:0}
.ck .pay{display:none;font-style:normal;font-weight:700;font-size:16px;line-height:1}
.ck .chk{position:absolute}
.item.free{--tc:#0E9F8F;--tcs:#D5F2EE}
.ck span{position:relative}
.ck.bump span{transform:scale(1.18)}
.item.half .ck span{background:var(--tcs)}
.item.half .ck .pay{display:block;color:var(--tc)}
.item.fin .ck span{background:var(--done);border-color:var(--done)}
.item.fin .ck svg.chk{opacity:1;color:#fff}
.ibody{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0}
.iname{font-weight:700;font-size:16px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.item.fin .iname{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.isub{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--muted)}
.ist{font-weight:700;color:var(--tc)}
.item.fin .ist{color:var(--done)}
.inote{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.iprice{flex:none;text-align:right;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.iprice small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.item.fin .iprice{color:var(--muted)}
.star{color:var(--star)}

/* Forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 4px}
.card .desc{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.55}
.field{display:block;margin-bottom:12px}
.field > span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.inp{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:0 12px;outline:none;transition:border-color .12s}
textarea.inp{height:auto;min-height:88px;padding:10px 12px;line-height:1.55;resize:vertical}
.inp:focus{border-color:var(--pre);background:var(--card)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:46px;padding:0 16px;border-radius:12px;border:0;font-weight:700;font-size:15px;background:var(--text);color:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--paper);color:var(--text);border:1.5px solid var(--line)}
.btn.pre{background:var(--pre);color:#fff}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-width:48px;height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px}
.pick button.sec{border-color:var(--sc);color:var(--sc)}
.pick button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--card)}
.pick button.sec[aria-pressed="true"]{background:var(--sc);border-color:var(--sc);color:#fff}
.pick button.pre[aria-pressed="true"]{background:var(--pre);border-color:var(--pre);color:#fff}
.pick button.on[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:#fff}
.pick button.seatpick{display:flex;align-items:center;gap:8px}
.pick button.seatpick i{display:flex;gap:3px}
.pick button.seatpick i em{width:12px;height:12px;border-radius:3px;background:currentColor}
.pick button.seatpick i em.off{background:transparent;box-shadow:inset 0 0 0 2px currentColor;opacity:.6}
.checkline{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0 12px}
.checkline input{width:20px;height:20px;accent-color:var(--pre)}

.secrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.secrow .sw2{width:44px;height:44px;border-radius:10px;background:var(--sc);color:#fff;font-family:var(--display);font-size:20px;display:grid;place-items:center;flex:none}
.secrow .inp{flex:1}
.secrow .cnt{font-size:13px;color:var(--muted);min-width:44px;text-align:center}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;padding:0}
.iconbtn svg{width:20px;height:20px}
.iconbtn.danger{color:var(--danger)}
.schrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;position:relative;padding-left:18px}
.schrow::before{content:"";position:absolute;left:5px;top:-8px;bottom:-8px;width:3px;background:var(--line)}
.schrow:first-child::before{top:50%}
.schrow:last-child::before{bottom:50%}
.schrow::after{content:"";position:absolute;left:1px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--pre)}
.schrow.past{opacity:.45}
.schrow.now::after{background:var(--on);box-shadow:0 0 0 4px var(--on-soft)}
.stime{width:86px!important;flex:none;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;padding:0 6px!important;letter-spacing:.02em}
.schrow.now .stime,.schrow.now .stext{border-color:var(--on)}
.schrow .stext{flex:1;min-width:0}
.schadd{display:flex;gap:8px;margin-top:12px;align-items:center}
.schadd .inp:not(.stime){flex:1;min-width:0}
.nowline{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:14px}
.nowline div{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowline b{font-variant-numeric:tabular-nums}
.np{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--frame-2);color:var(--frame-muted)}
.np.now{background:var(--on);color:#fff}
#app.mapmode .stats{display:none}
main.mapmode{overflow:hidden}
.mapwrap{height:100%;display:flex;flex-direction:column}
.maptop{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
.maptop .chips{flex:1;margin:0;min-width:0}
.editbtn{height:38px;padding:0 14px;font-size:14px;flex:none}
.mapview{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:var(--paper);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mapview.editing{background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(108,76,241,.07) 14px 28px),var(--paper)}
.mapcanvas{position:absolute;left:0;top:0;transform-origin:0 0;background-color:var(--card);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;box-shadow:0 0 0 2px var(--line);border-radius:4px}
.mk{position:absolute;z-index:1;border-radius:8px;border:2px solid var(--mc);display:flex;align-items:center;justify-content:center;text-align:center}
.mk::before{content:"";position:absolute;inset:0;background:var(--mc);opacity:.22;border-radius:6px}
.mk span{position:relative;font-weight:700;font-size:13px;line-height:1.25;padding:4px;word-break:keep-all;overflow:hidden;max-height:100%;color:var(--text)}
.mk.sel{outline:3px solid var(--text);outline-offset:2px;z-index:3}
.rh{position:absolute;right:-14px;bottom:-14px;width:30px;height:30px;border-radius:50%;background:var(--text);border:3px solid var(--card);z-index:4}
.mb{position:absolute;z-index:2;border-radius:7px;background:var(--sc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:2px;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.mb b{font-family:var(--display);font-weight:400;font-size:15px;line-height:1;white-space:nowrap}
.mb.long b{font-size:12px}
.mb.xlong b{font-size:10px}
.mb b{position:relative;z-index:1}
.mb.full:not(.multi)::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;border-left:1.5px dashed rgba(255,255,255,.45)}
.mb.full.vert:not(.multi)::before{left:6px;right:6px;top:50%;bottom:auto;border-left:0;border-top:1.5px dashed rgba(255,255,255,.45)}
.mb.full.none::before,.mb.full.done::before{border-color:var(--line)}
.mb.dim{opacity:.18}
.maptags{flex:none;padding:0 12px 8px;margin:0;background:var(--paper);border-bottom:1px solid var(--line)}
.mb i{display:none;font-style:normal;font-size:8px;font-weight:700;line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;padding:0 2px}
.mapcanvas.zoomed .mb i{display:block}
.mb.none{background:var(--card);color:var(--sc);border:2px dashed var(--sc);box-shadow:none}
.mb.done{background:var(--line);color:var(--muted);box-shadow:none}
.mb.done::after{content:"✓";position:absolute;top:1px;right:3px;font-size:11px;font-weight:700;color:var(--done)}
.mst{position:absolute;top:0;right:2px;font-style:normal;font-size:11px;color:#FFE14D;text-shadow:0 0 2px rgba(0,0,0,.6)}
.mb.sel{outline:3px solid var(--text);outline-offset:2px;z-index:5}
.mb.dragging,.mk.dragging{opacity:.85;z-index:6;box-shadow:0 10px 20px rgba(0,0,0,.28)}
.mb.pulse{animation:mpulse 1.2s ease-out 3}
@keyframes mpulse{0%{box-shadow:0 0 0 0 var(--sc)}100%{box-shadow:0 0 0 20px rgba(0,0,0,0)}}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:8}
.zoomctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:20px;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.zoomctl button.fit{font-size:12px}
.legend{position:absolute;left:12px;bottom:12px;z-index:8;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:5px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:18px;height:12px;border-radius:3px;display:inline-block}
.mapempty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:7;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-align:center;font-size:14px;line-height:1.6;color:var(--muted);width:min(300px,84%)}
.mapempty strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.mapbottom{flex:none;background:var(--card);border-top:1px solid var(--line);padding:10px 12px 12px}
.selbar{display:flex;align-items:center;gap:8px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line);min-height:50px}
.selbar .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selbar .hint{font-size:13px;color:var(--muted);line-height:1.5}
.btn.sm{height:40px;padding:0 12px;font-size:14px}
.inp.sm{height:40px;flex:1;min-width:0}
.sws{display:flex;gap:4px;flex:none}
.swc{width:28px;height:28px;border-radius:50%;border:3px solid var(--card);background:var(--mc);box-shadow:0 0 0 1px var(--line);padding:0}
.swc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--text)}
.trayhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.traychips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.traychips::-webkit-scrollbar{display:none}
.tchip{flex:none;height:42px;padding:0 12px;border-radius:10px;border:0;background:var(--sc);color:#fff;font-family:var(--display);font-size:16px;display:flex;align-items:center;gap:6px}
.tnone{font-size:13px;color:var(--muted);padding:8px 0}
.bulkhint{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 10px}
.bulkhint b{color:var(--text)}
.bulkwrap{overflow:auto;max-height:52vh;max-height:52dvh;border:1px solid var(--line);border-radius:12px;background:var(--card);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
table.bulk{border-collapse:separate;border-spacing:0;min-width:100%}
table.bulk th{position:sticky;top:0;z-index:2;background:var(--paper);font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.bulk td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.bulk td:last-child{border-right:0}
table.bulk .rn{position:sticky;left:0;z-index:1;background:var(--card);width:76px;min-width:76px;text-align:center;padding:0 4px;border-right:2px solid var(--line)}
table.bulk th.rn{z-index:3;background:var(--paper)}
table.bulk .rn .mini{font-size:14px;padding:4px 6px 3px}
.rnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bst{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 5px;line-height:1.3}
.bst.err{background:var(--on-soft);color:var(--danger)}
.bst.warn{background:#FFF2C2;color:#8A6200}
.bc{width:100%;height:44px;border:0;background:transparent;padding:0 10px;outline:none;font-size:16px}
.bc:focus{background:var(--pre-soft);box-shadow:inset 0 0 0 2px var(--pre)}
.bc::placeholder{color:var(--muted);opacity:.55}
.w-sec{width:68px;min-width:68px}.w-num{width:88px;min-width:88px}.w-name{min-width:170px}.w-tags{min-width:150px}.w-memo{min-width:180px}
#sheet.full{left:0;right:0;top:0;bottom:0;width:100%;max-width:none;height:100%;max-height:none;border-radius:0;margin:0;padding-top:env(safe-area-inset-top,0px)}
#sheet.full .handle{display:none}
#sheet.full .sh-grab{padding-top:12px}
#sheet.full .sh-body{display:flex;flex-direction:column;padding-bottom:12px}
#sheet.full .bulkwrap{flex:1 1 auto;max-height:none;min-height:180px}
#sheet.full .bulkfoot{flex:none}
.shx{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer}
details.bulkhelp{flex:none;margin:0 0 10px}
details.bulkhelp > summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);padding:4px 0;list-style:none;display:flex;align-items:center;gap:6px}
details.bulkhelp > summary::-webkit-details-marker{display:none}
details.bulkhelp > summary::before{content:"▸";font-size:11px;transition:transform .15s}
details.bulkhelp[open] > summary::before{transform:rotate(90deg)}
details.bulkhelp .bulkhint{margin:6px 0 0}
.bulkfoot{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.bulkfoot .sum{flex:1;min-width:150px;font-size:13px;color:var(--muted);line-height:1.5}
.bulkfoot .sum b{color:var(--text);font-size:15px}
.btn:disabled{opacity:.4}
.icat{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;color:var(--tc);background:var(--tb)}
select.inp{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 20px,calc(100% - 11px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.addbox .addtop{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:8px;margin-bottom:8px}
.dlg-box .inp{margin:-6px 0 16px}
.evbtn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:none;color:inherit;padding:0;text-align:left}
.evbtn .ev-name{flex:0 1 auto}
.evbtn svg{flex:none;width:20px;height:20px;color:var(--frame-muted)}
.evrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 6px 4px;margin-bottom:8px}
.evrow.cur{border-color:var(--pre);background:var(--pre-soft)}
.evmain{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.evn{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evs{font-size:12px;color:var(--muted)}
.dday.sm{font-size:14px;padding:4px 8px 3px;border-radius:8px}
.dl{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;line-height:1.5;background:var(--pre-soft);color:var(--pre);white-space:nowrap}
.dl.soon{background:#FFF2C2;color:#8A6200}
.dl.late{background:var(--on-soft);color:var(--danger)}
.dl.ok{background:var(--done-soft);color:var(--done)}
.chead .dl{flex:none}
.timebox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-bottom:12px}
.trow{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px}
.trow + .trow{border-top:1px solid var(--line)}
.trow .tl{flex:1;min-width:0;color:var(--muted)}
.trow b{font-variant-numeric:tabular-nums;font-size:16px}
.trow.pick .tl{color:var(--pre);font-weight:700}
.timerow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.timerow .inp:not(.stime){flex:1;min-width:0}
.alertline{display:flex;align-items:center;gap:8px;margin-top:8px;background:#FFE14D;color:#1A1D3A;border:0;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;width:100%;text-align:left}
.alertline.late{background:var(--on);color:#fff}
.alertline span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdl{position:absolute;left:2px;bottom:0;font-style:normal;font-size:10px}
.w-time{width:96px;min-width:96px}
.row2{flex-wrap:wrap}
.toggles{display:flex;flex-direction:column;gap:2px}
.mapview:not(.editing) .mapcanvas{background-image:none;box-shadow:0 0 0 1px var(--line)}
.tag.fr{background:#FFE98A;color:#5C4300}
.booth.friend{box-shadow:inset 0 0 0 2px #F5C400}
.mb.fr{box-shadow:0 0 0 3px #F5C400}
.mfr{position:absolute;left:3px;top:1px;font-style:normal;font-size:10px;color:#FFE14D;text-shadow:0 0 2px rgba(0,0,0,.6)}
.mb.none .mfr,.mb.done .mfr{color:#C99A00;text-shadow:none}
.chip.frc{border-color:#F5C400;color:#5C4300;font-size:14px}
.chip.frc[aria-pressed="true"]{background:#F5C400;border-color:#F5C400;color:#3A2A00}
.frline{display:flex;gap:8px;align-items:center}
.frline .inp{flex:1;min-width:0}
.frtog{flex:none;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;padding:0 12px;font-size:14px;white-space:nowrap}
.frtog[aria-pressed="true"]{background:#F5C400;border-color:#F5C400;color:#3A2A00}
.addhead{display:flex;align-items:center;gap:8px;margin:16px 2px 8px}
.addhead h4{margin:0;font-size:15px}
.addhead #bCount{font-size:13px;color:var(--muted)}
.addbox[hidden]{display:none}
.artists{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.arow{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px}
.anick{flex:1;min-width:0;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border-radius:9px;font-weight:700;font-size:15px;color:var(--text);text-decoration:none}
a.anick{background:var(--pre-soft);color:var(--pre)}
.anick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anick small{flex:none;font-size:11px;font-weight:500;opacity:.75}
.anick svg{flex:none;width:16px;height:16px}
.ainfo{flex:none;display:flex;align-items:center;height:40px;padding:0 12px;border-radius:9px;background:#DDF1FB;color:#0A6E9E;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.bartists{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artedit{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px}
.artedit .inp{height:42px;background:var(--card)}
.artedit .full{grid-column:1 / 2}
.artedit .wide{grid-column:1 / -1}
.artedit .iconbtn{grid-row:1;grid-column:2}
.imay{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:#FFF2C2;color:#8A6200}
.item.maybe .ck span{border-style:dashed;opacity:.7}
.item.maybe .iname{color:var(--muted)}
.item.maybe .iprice{color:var(--muted);font-weight:500}
.item.maybe{background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(232,168,0,.06) 10px 20px)}
.tag.may{background:#FFF2C2;color:#8A6200}
.sums .mb2{background:#FFF2C2;color:#8A6200;grid-column:1 / -1}
.mb.maybe{background:var(--card);color:var(--sc);border:2px solid var(--sc);box-shadow:none}
.mb.maybe::after{content:"?";position:absolute;top:1px;right:3px;font-size:10px;font-weight:700}
.rowp{display:flex;gap:8px;margin-bottom:10px}
.rowp .inp{flex:1;min-width:0}
.maytog{flex:none;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;padding:0 12px;font-size:14px;white-space:nowrap}
.maytog[aria-pressed="true"]{background:#FFE58A;border-color:#E8B400;color:#5C4300}
.pick button.may[aria-pressed="true"]{background:#E8B400;border-color:#E8B400;color:#3A2A00}
.pick button.mustb[aria-pressed="true"]{background:var(--star);border-color:var(--star);color:#3A2A00}
.stat .v .may{display:block;font-size:11px;font-weight:500;color:var(--frame-muted);margin-top:1px}
.tab{font-size:11px}
.item.free{--tc:#0E9F8F;--tcs:#D5F2EE}
.seg button.free[aria-pressed="true"]{background:#0E9F8F;color:#fff}
.pick button.free{border-color:#0E9F8F33}
.pick button.free[aria-pressed="true"]{background:#0E9F8F;border-color:#0E9F8F;color:#fff}
.smp{display:block;width:max-content;margin:6px 0 0 auto;font-size:12px;font-weight:700;color:#0A6E9E;background:#DDF1FB;border-radius:6px;padding:3px 8px;text-decoration:none}
.agrp{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;background:var(--paper);border-top:1px solid var(--line)}
.itembox > .agrp:first-child,.itembox > .agbox:first-child > .agrp,#bItems.dnd .agbox.ec + .agbox > .agrp{border-top:0}
.agrp .an{flex:none;font-weight:700;font-size:13px;color:var(--muted);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agrp .an::before{content:"";display:inline-block;width:10px;height:2px;background:var(--muted);vertical-align:middle;margin-right:6px;opacity:.6}
.amemo{flex:1;min-width:0;height:34px;border:1px dashed var(--line);border-radius:8px;background:var(--card);padding:0 8px;font-size:16px;outline:none}
.amemo:focus{border-style:solid;border-color:var(--pre)}
.aempty{padding:10px 14px;font-size:13px;color:var(--muted)}
.imgedit{display:flex;gap:10px;align-items:center}
.imgbtns{display:flex;flex-direction:column;gap:6px}
.imgbtns label{cursor:pointer}
.perrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px;gap:5px}
.perrow .inp{min-width:0;width:100%;padding:0 4px!important}
.perrow .stime{width:100%!important}
.sh-body{overflow-x:hidden}
.perrow .inp{padding:0 6px}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0;line-height:1.5}
.pplhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pplsum{flex:1;font-size:14px;color:var(--muted);line-height:1.5}
.pplsum b{color:var(--text)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}

.phead{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 6px;border-bottom:1px solid var(--line)}
.pmet{flex:none;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0}
.pmet svg{width:30px;height:30px;padding:5px;border-radius:50%;border:3px solid #F5C400;color:transparent}
.pmet[aria-pressed="true"] svg{background:var(--done);border-color:var(--done);color:#fff}
.pmain{flex:1;min-width:0;border:0;background:none;text-align:left;display:flex;flex-direction:column;gap:2px;padding:4px 0}
.pn{font-weight:700;font-size:17px}
.pcard.met .pn{text-decoration:line-through}
.pm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gifts{padding:6px 10px 10px}
.gift{display:flex;align-items:center;gap:6px;min-height:42px}
.gck{flex:none;width:40px;height:40px;border:0;background:none;display:grid;place-items:center;padding:0}

.gck[aria-pressed="true"] svg{background:var(--done);border-color:var(--done);color:#fff}
.gn{flex:1;min-width:0;font-size:15px}
.gift.done .gn{text-decoration:line-through;color:var(--muted)}
.gx{flex:none;width:36px;height:36px;border:0;background:none;color:var(--muted);font-size:20px}
.gadd{display:flex;gap:6px;margin-top:6px}
.gcount{font-size:12px;color:var(--muted);margin-top:6px;text-align:right}
.erow{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 2px;border-top:1px solid var(--line)}

.card .cgroup{margin-bottom:10px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:720px;margin:0 auto;background:var(--paper);border-radius:22px 22px 0 0;
  max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom,0px);will-change:transform}
.sheet.show{transform:translateY(0)}
.sheet.dragging{transition:none}
.sh-grab{flex:none;padding:8px 16px 0;touch-action:none}
.handle{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;gap:12px;padding:0 0 12px}
.sh-head .stamp{min-width:84px}
.sh-title{flex:1;min-width:0}
.sh-title h3{margin:0;font-size:19px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.sh-title .bmeta{margin-top:5px}
.sh-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px 20px}
.sh-plain h3{margin:0;font-size:19px}
.back{border:0;background:none;display:flex;align-items:center;gap:4px;color:var(--muted);font-weight:700;font-size:14px;padding:6px 0;height:40px}
.back svg{width:18px;height:18px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 8px}
.sec-title h4{margin:0;font-size:15px}
.sec-title span{font-size:13px;color:var(--muted)}
.itembox{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.itembox .empty{padding:22px 16px;font-size:14px}
.addbox{background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:12px;margin-top:12px}
.addbox .grid2{margin-bottom:10px}
.addbox .rowx{display:flex;gap:8px;align-items:center}
.addbox .rowx .pick{flex:1;flex-wrap:nowrap}
.addbox .rowx .pick button{flex:1;padding:0 8px;font-size:15px}
.qty{width:72px;text-align:center}
.sums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sums div{border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700}
.sums .p{background:var(--pre-soft);color:var(--pre)}
.sums .o{background:var(--on-soft);color:var(--on)}
.sums b{display:block;font-size:16px;color:var(--text);margin-top:2px;font-variant-numeric:tabular-nums}

/* Dialog + toast */
.dlg{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(10,12,30,.55)}
.dlg.show{display:flex}
.dlg-box{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:360px}
.dlg-box p{margin:0 0 18px;line-height:1.6;font-size:15px;white-space:pre-line}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--card);
  padding:11px 18px;border-radius:22px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* cloud */
.np.lk{background:#fff;color:var(--pre)}
.np.lk.sub{background:#E6F4EA;color:#1E7B3A}
.np.lk.edit{background:#FFF1DC;color:#A85A00}
.acct{display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.acct img,.acct .av{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover}
.acct .av{display:grid;place-items:center;background:var(--pre-soft);color:var(--pre);font-weight:800}
.acct b{display:block;font-size:15px}
.acct small{display:block;font-size:12px;color:var(--muted);word-break:break-all}

function ddayInfo(){ return ddayOf(S.event.date); }
function ddayOf(d){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d||"")) return null;
  const [y,m,dd] = d.split("-").map(Number);
  const target = new Date(y, m-1, dd), now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((target - today)/86400000);
  if(diff === 0) return {t:"D-DAY", c:"today"};
  if(diff > 0) return {t:"D-" + diff, c:""};
  return {t:"D+" + (-diff), c:"past"};
}
function totals(){
  let pre=0, preF=0, on=0, onF=0, paid=0, unpaid=0, maybe=0, maybeAmt=0;
  for(const b of S.booths) for(const i of linesOf(b)){
    if(i.maybe){ maybe++; maybeAmt += amt(i); continue; }
    if(i.type==="free") continue;
    if(i.type==="pre"){ pre++; if(isFinal(i)) preF++; } else { on++; if(isFinal(i)) onF++; }
    if(isPaid(i)) paid += amt(i); else unpaid += amt(i);
  }
  return {pre,preF,on,onF,paid,unpaid,maybe,maybeAmt};
}
function normTime(v){
  v = String(v||"").trim(); if(!v) return "";
  let h, m;
  const mm = v.match(/^(\d{1,2})\s*[:.시h]\s*(\d{0,2})/i);
  if(mm){ h = +mm[1]; m = mm[2] ? +mm[2] : 0; }
  else {
    const d = v.replace(/\D/g,"");
    if(!d || d.length > 4) return null;
    if(d.length <= 2){ h = +d; m = 0; } else { h = +d.slice(0, d.length-2); m = +d.slice(-2); }
  }
  if(h > 23 || m > 59) return null;
  return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}
function sortedSch(){ return S.event.schedule.slice().sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")); }
function isEventToday(){ const d = ddayInfo(); return !!d && d.c === "today"; }
function nowHM(){ const n = new Date(); return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"); }
function schNow(){
  if(!isEventToday()) return {cur:null, nxt:null};
  const list = sortedSch().filter(x=>x.time), hm = nowHM();
  let cur = null, nxt = null;
  for(const x of list){ if(x.time <= hm) cur = x; else { nxt = x; break; } }
  return {cur, nxt};
}
function nowMin(){ const n = new Date(); return n.getHours()*60 + n.getMinutes(); }
function hmMin(t){ const [h,m] = t.split(":").map(Number); return h*60 + m; }
function fmtLeft(m){ return m >= 60 ? `${Math.floor(m/60)}시간${m%60 ? " " + m%60 + "분" : ""}` : `${m}분`; }
function pickupState(b){
  if(!b.pickup) return null;
  const ls = linesOf(b), hasPre = ls.some(i=>i.type==="pre" && !i.maybe), pend = ls.some(i=>i.type==="pre" && !i.maybe && i.st<2);
  if(hasPre && !pend) return {cls:"ok", text:"선입금 수령 완료", pend:false};
  if(!isEventToday()) return {cls:"", text:`수령 마감 ${b.pickup}`, pend};
  const left = hmMin(b.pickup) - nowMin();
  if(left < 0) return {cls:"late", text:`수령 마감 지남 (${b.pickup})`, left, pend};
  if(left <= 60) return {cls:"soon", text:`수령 마감 ${fmtLeft(left)} 전`, left, pend};
  return {cls:"", text:`수령 마감 ${b.pickup} · ${fmtLeft(left)} 남음`, left, pend};
}
function dlChip(b){ const ps = pickupState(b); return ps ? `<span class="dl ${ps.cls}">⏰ ${ps.text}</span>` : ""; }
function urgentBooths(){
  if(!isEventToday()) return [];

}

/* 카드 쌓기: 넓은 화면에서 카드를 가장 짧은 열에 차례로 넣어 빈칸 없이 채움 */
const MAS_MIN = 380, MAS_GAP = 12;
function masonry(el){
  if(!el) return;
  const cols = [...el.children].filter(c=>c.classList.contains("mcol"));
  let cards = [];
  if(cols.length) cards = [...el.querySelectorAll(":scope > .mcol > *")].sort((a,b)=>(+a.dataset.mi) - (+b.dataset.mi)).concat([...el.children].filter(c=>!c.classList.contains("mcol")));
  else cards = [...el.children];
  const full = cards.filter(c=>c.classList.contains("empty") || c.classList.contains("evhint") || c.classList.contains("mfull"));
  const items = cards.filter(c=>!full.includes(c));
  items.forEach((c,i)=>{ c.dataset.mi = i; });
  const w = el.clientWidth - (parseFloat(getComputedStyle(el).paddingLeft) || 0) - (parseFloat(getComputedStyle(el).paddingRight) || 0);
  const n = window.innerWidth >= 900 ? Math.max(1, Math.floor((w + MAS_GAP) / (MAS_MIN + MAS_GAP))) : 1;
  el.innerHTML = "";
  if(n < 2 || items.length < 2){ el.classList.remove("mas"); for(const c of [...items, ...full]) el.appendChild(c); return; }
  el.classList.add("mas");
  const colEls = Array.from({length:n}, ()=>{ const d = document.createElement("div"); d.className = "mcol"; el.appendChild(d); return d; });
  const hs = new Array(n).fill(0);
  for(const c of items){
    let k = 0; for(let j = 1; j < n; j++) if(hs[j] < hs[k] - 1) k = j;
    colEls[k].appendChild(c); hs[k] += c.offsetHeight + MAS_GAP;
  }
  for(const c of full){ c.style.flexBasis = "100%"; el.appendChild(c); }
}
let masT = null;
window.addEventListener("resize", ()=>{ clearTimeout(masT); masT = setTimeout(()=>{ if(view === "check") masonry(document.getElementById("checkList")); else if(view === "evtab") masonry(main.querySelector(".evgrid")); }, 150); });

function vpSize(){ const vp = $("mapview"); const r = vp ? vp.getBoundingClientRect() : {width:360,height:500}; return {w:r.width, h:r.height}; }

  const b = contentBounds(h.id);

function freeSpot(h, w, hh, cx, cy, occ){

      if(Math.max(Math.abs(dx),Math.abs(dy)) !== r) continue;

      for(let i=0;i<w&&ok;i++) for(let j=0;j<hh;j++) if(occ.has((x+i)+","+(y+j))){ ok=false; break; }

function bindMap(){

    }

    const it = e.target.closest(".rh,.mb,.mk");
    mapG = {type:"pan", id:e.pointerId, sx:e.clientX, sy:e.clientY, tx0:V.tx, ty0:V.ty, moved:false, it};
    if(mapEdit && it){
      if(it.classList.contains("rh")){ const m = S.marks.find(x=>x.id===it.dataset.mid); if(m) Object.assign(mapG, {type:"resize", obj:m, w0:m.w, h0:m.h, el:it.parentElement}); }

      else { const m = S.marks.find(x=>x.id===it.dataset.mid); if(m) Object.assign(mapG, {type:"move", kind:"m", obj:m, x0:m.x, y0:m.y, el:it}); }

    if(mapG.type === "pinch"){
      if(ptrs.size < 2) return;
      const [a,b] = [...ptrs.values()], r = vp.getBoundingClientRect();
      const d = Math.hypot(a.x-b.x,a.y-b.y)||1, m = {x:(a.x+b.x)/2-r.left, y:(a.y+b.y)/2-r.top};
      const z = clampZ(mapG.z0*d/mapG.d0), cx = (mapG.m0.x-mapG.tx0)/mapG.z0, cy = (mapG.m0.y-mapG.ty0)/mapG.z0;
      V.z = z; V.tx = m.x - cx*z; V.ty = m.y - cy*z; mapActive(); applyView(); return;
    }
    if(e.pointerId !== mapG.id) return;
    const dx = e.clientX-mapG.sx, dy = e.clientY-mapG.sy;
    if(!mapG.moved){ if(Math.hypot(dx,dy) < 7) return; mapG.moved = true; if(mapG.el) mapG.el.classList.add("dragging"); }
    if(mapG.type === "pan"){ V.tx = mapG.tx0+dx; V.ty = mapG.ty0+dy; mapActive(); applyView(); }
    else if(mapG.type === "move"){
      const o = mapG.obj, f = mapG.kind==="b" ? fp(o) : {w:o.w, h:o.h}, off = mapG.kind==="b" ? 2 : 0;
      const fr = curFrame();
      const nx = Math.round(mapG.x0 + dx/(CELL*V.z)), ny = Math.round(mapG.y0 + dy/(CELL*V.z));
      if(nx !== mapG.nx || ny !== mapG.ny){ mapG.nx = nx; mapG.ny = ny; mapG.el.style.left = (nx-fr.ox)*CELL+off+"px"; mapG.el.style.top = (ny-fr.oy)*CELL+off+"px"; }
    } else if(mapG.type === "resize"){
      const o = mapG.obj;
      const nw = clamp(Math.round(mapG.w0 + dx/(CELL*V.z)), 1, 200), nh = clamp(Math.round(mapG.h0 + dy/(CELL*V.z)), 1, 200);
      if(nw !== mapG.nw || nh !== mapG.nh){ mapG.nw = nw; mapG.nh = nh; mapG.el.style.width = nw*CELL+"px"; mapG.el.style.height = nh*CELL+"px"; }
    }
  });
  const up = e=>{
    if(!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if(!mapG) return;
    if(mapG.type === "pinch"){
      if(ptrs.size === 1){ const [[id,p]] = [...ptrs.entries()], V = mv(); mapG = {type:"pan", id, sx:p.x, sy:p.y, tx0:V.tx, ty0:V.ty, moved:true}; }
      else if(!ptrs.size) mapG = null;
      return;
    }
    if(e.pointerId !== mapG.id) return;
    const g = mapG; mapG = null;
    if(e.type === "pointercancel"){ renderMapItems(); return; }
    if(!g.moved){ mapTap(g.it); return; }
    if(g.type === "move"){
      if(g.nx != null){ if(g.kind==="b"){ g.obj.pos.x = g.nx; g.obj.pos.y = g.ny; } else { g.obj.x = g.nx; g.obj.y = g.ny; } save(); }
      mapSel = {t:g.kind, id:g.obj.id}; renderMapItems(); renderMapBottom();
    } else if(g.type === "resize"){
      if(g.nw != null){ g.obj.w = g.nw; g.obj.h = g.nh; save(); }
      renderMapItems();
    }
  };
  vp.addEventListener("pointerup", up);
  vp.addEventListener("pointercancel", up);
  vp.addEventListener("wheel", e=>{
    e.preventDefault(); mapActive();
    const r = vp.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY*0.0015));
  }, {passive:false});
}

function b64urlFromBytes(bytes){
  let bin = ""; const CH = 0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function bytesFromB64url(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "=";
  const bin = atob(s), out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function pipe(bytes, Stream, fmt, max){
  const st = new Blob([bytes]).stream().pipeThrough(new Stream(fmt));
  if(!max) return new Uint8Array(await new Response(st).arrayBuffer());
  const rd = st.getReader(), parts = []; let n = 0;
  for(;;){
    const {done, value} = await rd.read(); if(done) break;
    n += value.length;
    if(n > max){ try{ rd.cancel(); }catch(e){} throw new Error("데이터가 너무 커서 열 수 없어요"); }
    parts.push(value);
  }
  const out = new Uint8Array(n); let o = 0; for(const x of parts){ out.set(x, o); o += x.length; }
  return out;
}
const MAX_INFLATE = 30 * 1024 * 1024;
const SHARE_ALL = {items:true, status:true, people:true, memo:true};
function shareOpts(){
  const g = id=>{ const el = document.getElementById(id); return !!(el && el.checked); };
  const items = g("shItems");

}
function exportData(o){
  o = o || {};
  const d = JSON.parse(JSON.stringify(S));
  for(const b of d.booths){
    if(!o.items) b.items = [];
    else if(!o.status) b.items.forEach(i=>{ i.st = 0; });
    if(!o.people){ b.isFriend = false; b.friends = []; }
    if(!o.memo){ b.memo = ""; b.pmemo = ""; b.tags = []; b.artists.forEach(a=>{ a.memo = ""; a.hidden = false; }); }
  }
  if(!o.people) d.people = [];
  return {app:"boothcheck", v:1, d};
}
async function makeCode(o){
  let bytes = new TextEncoder().encode(JSON.stringify(exportData(o)));
  if(typeof CompressionStream !== "undefined"){
    try{ return "BC1z:" + b64urlFromBytes(await pipe(bytes, CompressionStream, "deflate-raw")); }catch(e){}
  }
  return "BC1:" + b64urlFromBytes(bytes);
}
async function parseCode(raw){
  raw = raw.trim();
  if(raw.startsWith("{")) return JSON.parse(raw);
  const m = raw.replace(/\s+/g,"").match(/^(BC1z?):([A-Za-z0-9_-]+)$/);
  if(!m) throw new Error("형식이 맞지 않는 코드예요");
  let bytes = bytesFromB64url(m[2]);
  if(m[1] === "BC1z"){
    if(typeof DecompressionStream === "undefined") throw new Error("이 브라우저에서는 이 코드를 열 수 없어요");
    bytes = await pipe(bytes, DecompressionStream, "deflate-raw", MAX_INFLATE);
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function doImport(raw){
  if(!raw || !raw.trim()){ toast("코드를 먼저 붙여 넣어 주세요"); return; }
  const live = parseLive(raw);

    if(!CL.on){ toast("이 화면에서는 실시간 공유 코드를 쓸 수 없어요"); return; }

    const ci = document.getElementById("codeIn"); if(ci) ci.value = "";
    return;

  if(!obj || obj.app !== "boothcheck" || !obj.d){ toast("부스 체크용 코드가 아니에요"); return; }

}
function makeText(o){
  o = o || {}; const includeSt = o.status;
  const e = S.event, L = [];
  if(e.name) L.push("■ " + e.name);
  const when = [e.date, e.time].filter(Boolean).join(" ");

  if(e.place) L.push("장소: " + e.place);
  if(e.info.trim()) L.push("", e.info.trim());
  const sch = sortedSch().filter(x=>x.time||x.text);
  if(sch.length){ L.push("", "[진행 시간표]"); for(const x of sch) L.push(`${x.time||"--:--"} ${x.text}`); }
  let cur = null;
  for(const b of sortedBooths()){
    if(b.section !== cur){ cur = b.section; L.push("", `[${cur} 구역]`); }
    L.push(`${boothCode(b)} ${b.name || "(이름 없음)"} · ${seatLabel(b)}${o.memo && b.tags.length ? "  " + b.tags.map(t=>"#"+t).join(" ") : ""}`);

      const mark = includeSt ? (isFinal(i) ? "✅ " : (i.type==="pre" && i.st===1 ? "💸 " : "⬜ ")) : "- ";
      L.push(`  ${mark}${i.must?"★":""}[${typeLabel(i)}]${i.cat?"["+i.cat+"]":""} ${i.name} ${i.type==="free" ? "무료" : won(i.price)}${i.qty>1?" ×"+i.qty:""}${i.note?" ("+i.note+")":""}${i.maybe?" (고민중)":""}${i.sample?" 샘플: "+i.sample:""}`);
    }
    for(const a of b.artists) L.push(`  작가: ${a.nick || "-"}${a.site ? " " + a.site : ""}${a.info ? "  인포: " + a.info : ""}${periodOf(a) ? "  선입금: " + periodText(periodOf(a)) + (a.preLink ? " " + a.preLink : "") : ""}${(a.imgs||[]).length ? "  인포 이미지: " + a.imgs.join(" ") : ""}`);
    if(o.people && b.isFriend) L.push("  지인: " + (b.friends.length ? b.friends.join(", ") : "♥"));
    if(b.pickup) L.push("  선입금 수령 마감: " + b.pickup);
    if(b.times.length) L.push("  시간: " + b.times.slice().sort((x,y)=>(x.time||"99").localeCompare(y.time||"99")).map(x=>`${x.time||"--:--"} ${x.label}`).join(", "));
    if(o.memo && b.memo.trim()) L.push("  메모: " + b.memo.trim().replace(/\n/g," / "));
  }
  return L.join("\n").trim();
}

function parseWitch(text){
  const lines = String(text||"").replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean);
  const out = [];
  for(const ln of lines){
    const q = ln.match(/^[-−–]\s*(\d+)?\s*\+$/);
    if(q){ if(out.length && q[1] != null){ const r = out[out.length-1]; r.qty = Math.max(0, +q[1]); r.on = r.qty > 0; } continue; }
    const m = ln.match(/^(?:\d+\s*[.)]\s*)*(.+?)\s*[(（]\s*([\d,]+)\s*원\s*(?:\/\s*([^)）]*))?[)）]\s*(.*)$/);
    if(!m) continue;
    const unit = (m[3]||"").trim(), extra = (m[4]||"").trim();
    out.push({name:m[1].trim(), price:parsePrice(m[2]), unit: unit && !/^1\s*개$/.test(unit) ? unit : "", extra, qty:0, on: false, sold: /품절|sold\s*out/i.test(extra + m[1])});
  }
  return out;
}
function commonPrefix(names){
  if(names.length < 2) return "";
  const words = names.map(n=>n.split(/\s+/)), w = words[0][0];
  return w && words.every(ws=>ws[0] === w && ws.length > 1) ? w : "";
}

function wfParse(){
  const prev = new Map((sh.rows||[]).map(r=>[r.name, r]));

  sh.prefix = commonPrefix(sh.rows.map(r=>r.name));
  if(sh.strip == null) sh.strip = false;
  wfDraw();
}
function wfName(r){ return sh.strip && sh.prefix && r.name.startsWith(sh.prefix + " ") ? r.name.slice(sh.prefix.length + 1) : r.name; }
function wfKey(n){ const w = n.split(/\s+/); return w.length > 1 ? w.slice(0,-1).join(" ") : null; }
function wfPlan(group){
  group = false;
  const rows = sh.rows || [];
  if(!group) return rows.map((r,k)=>({k}));
  const groups = new Map();
  rows.forEach((r,k)=>{ const key = wfKey(wfName(r)); if(key){ if(!groups.has(key)) groups.set(key, []); groups.get(key).push(k); } });
  const out = [], used = new Set();
  rows.forEach((r,k)=>{
    if(used.has(k)) return;
    const key = wfKey(wfName(r)), g = key && groups.get(key);
    if(g && g.length > 1){ g.forEach(x=>used.add(x)); out.push({group:key, ks:g}); } else out.push({k});
  });
  return out;
}
function wfDraw(){

  const plan = wfPlan(sh.group && canGroup);

function bulkParse(){
  let inherit = "";
  const seen = new Map(), out = [];
  const loadedIds = new Set(sh.rows.filter(r=>r.id).map(r=>r.id));
  sh.rows.forEach((r, i)=>{
    const empty = !BULK_COLS.some(c=>c!=="sec" && String(r[c]).trim());
    let sec = r.sec.trim(), raw = r.num.trim().replace(/\s+/g,"");
    const pre = raw.match(/^([A-Za-z가-힣]+)-?(\d.*)$/);
    if(pre && !sec){ sec = pre[1]; raw = pre[2]; }
    const eff = sec || inherit;
    if(sec) inherit = sec;
    const res = {i, empty, inherit:eff, sec:eff, id:r.id};
    if(empty){ out.push(res); return; }
    let num = raw, half = 0, span = 1;
    const hm = raw.match(/^(.+?)-([12])$/); if(hm){ num = hm[1]; half = +hm[2]; }
    const rg = raw.match(/^(\d+)~(\d+)$/);
    if(rg){ const a1 = parseInt(rg[1],10), a2 = parseInt(rg[2],10); if(a2 > a1 && a2 - a1 <= 3){ num = rg[1]; span = a2 - a1 + 1; } else { res.st = "err"; res.msg = "번호?"; out.push(res); return; } }
    num = num.replace(/-$/,"");
    if(!eff){ res.st = "err"; res.msg = "구역?"; out.push(res); return; }
    if(!num){ res.st = "err"; res.msg = "번호?"; out.push(res); return; }
    const pk = r.pickup.trim() ? normTime(r.pickup) : "";
    if(pk === null){ res.st = "err"; res.msg = "시간?"; out.push(res); return; }
    const arts = parseArtists(r.arts||"", r.tw||"");
    if(arts === null){ res.st = "err"; res.msg = "트위터?"; out.push(res); return; }
    res.num = num; res.half = half; res.span = span; res.pickup = pk; res.fr = parseFriend(r.friend); res.arts = arts;
    res.code = boothCode({section:eff, num, half, span});
    res.newSec = !S.sections.includes(eff);
    const key = eff + "|" + num + "|" + half;
    if(seen.has(key)){ res.st = "warn"; res.msg = "중복"; out.push(res); return; }
    const other = S.booths.find(b=>b.section===eff && b.num===num && (b.half||0)===half && b.id!==r.id);
    if(r.id){
      const b = findBooth(r.id);
      if(!b){ res.st = "err"; res.msg = "지워짐"; out.push(res); return; }
      if(other){ res.st = "warn"; res.msg = "번호 겹침"; out.push(res); return; }
      seen.set(key, i);
      const same = b.section===eff && b.num===num && (b.half||0)===half && spanOf(b)===span && b.name===r.name.trim()
        && b.tags.join("|")===splitTags(r.tags).join("|") && b.memo.replace(/\n/g," ")===r.memo && (b.pickup||"")===pk && !!b.isFriend===res.fr.isFriend && b.friends.join("|")===res.fr.friends.join("|") && artistsKey(b.artists)===artistsKey(res.arts);
      res.st = same ? "same" : "upd"; res.target = b;
    } else if(other){
      if(loadedIds.has(other.id)){ res.st = "warn"; res.msg = "중복"; out.push(res); return; }
      seen.set(key, i);
      res.st = "merge"; res.target = other;
    } else { seen.set(key, i); res.st = "ok"; }
    out.push(res);
  });
  return out;
}
function bulkCheck(){

    else if(r.st === "same"){ cell.innerHTML = `<span class="bst same">${esc(r.code)}</span>`; }

  const parts = [];

    + (warn ? `<br>겹치는 줄 ${warn}개는 건너뛰어요` : "")
    + (err ? `<br>왼쪽 빨간 표시를 확인할 줄 ${err}개` : "")
    + (newSecs.size ? `<br>새 구역(${[...newSecs].map(esc).join(", ")})도 함께 만들어져요` : "");
  if(btn){ btn.disabled = !(add || upd); btn.textContent = add && upd ? `추가 ${add} · 수정 ${upd} 저장` : add ? `${add}개 추가하기` : upd ? `${upd}개 고치기` : "저장"; }
}
function bulkSave(){

/* encode: JSON → deflate → Firestore Bytes */
async function zEnc(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let z = bytes, c = 0;
  if(typeof CompressionStream !== "undefined"){ try{ z = await pipe(bytes, CompressionStream, "deflate-raw"); c = 1; }catch(e){ z = bytes; c = 0; } }
  return {z:CL.F.Bytes.fromUint8Array(z), c, size:z.length};
}
async function zDec(d){
  if(!d || !d.z) throw new Error("no data");
  let bytes = d.z.toUint8Array();
  if(d.c) bytes = await pipe(bytes, DecompressionStream, "deflate-raw", MAX_INFLATE);
  return JSON.parse(new TextDecoder().decode(bytes));
}

  return "문제가 생겼어요" + (c ? ` (${c})` : "");

async function clApplyUserDoc(r){

  const id = r.id, ent0 = entOf(id);

  if(ent0 && ent0.acct && ent0.acct !== CL.user.uid) return;
  if(r.del){ if(ent0 && (ent0.mod||0) <= (r.upd||0)){ removeLocal(id); if(sh && sh.kind === "events") renderEvents(); } return; }
  if(ent0 && (r.upd||0) <= (ent0.cu||0)) return;
  if(id === LIB.current && (sh || viewerOpen())){ CL.pending[id] = r; return; }
  let payload; try{ payload = await zDec(r); }catch(e){ return; }
  if(!CL.user) return;
  if(id === LIB.current && (sh || viewerOpen())){ CL.pending[id] = r; return; }
  if(id === LIB.current && saveT) flush();
  let ent = entOf(id);
  if(ent && (r.upd||0) <= (ent.cu||0)) return;
  const R = normalize(payload.s), rjs = JSON.stringify(R);
  const dirty = !!ent && (ent.mod||0) > (ent.cu||0);
  let st = R;

    st = normalize(m3deep(sb || undefined, clone(local), clone(R)));

  if(!ent){ LIB.list.push({id}); ent = entOf(id); }

  ent.mod = dirty && js !== rjs ? Date.now() : r.upd;
  setSB(id, rjs);
  const lb = getBase(id), rb = payload.b && payload.b.p ? payload.b : null;
  if(!ent.link) setBase(id, null);
  else if(!dirty || !lb || (rb && (rb.v||0) > (lb.v||0))) setBase(id, rb);
  saveIndex();
  if(ent.mod > ent.cu) clQueueUser(id, 300);
  if(id === LIB.current){ S = st; srcCache = {b:null}; renderTop(); renderView(); clListenPub(); }

}

async function clOnPub(id, code, snap){

    return;

  const base0 = getBase(id);

  let R; try{ R = sanitizeProj(await zDec(d)); }catch(e){ return; }

    const P = shareProj(id === LIB.current ? S : loadEvent(id));

    setBase(id, {v:d.ver, p:R});
    applyTo(id, target, cur ? cur.p : null, false);

  }
  clRefreshUI();
}
function applyTo(id, P, prev, keepLocal){
  if(id === LIB.current){
    srcCache = {b:null};
    applyShared(S, P, prev, keepLocal);
    CL.quiet = true; try{ flush(); }finally{ CL.quiet = false; }
    if(sh && sh.kind === "booth") renderSheet();
    rerenderSoft();
    if(view === "info" && !(document.activeElement && main.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) renderInfo();
  } else {
    const st = loadEvent(id); applyShared(st, P, prev, keepLocal);
    const js = JSON.stringify(st); lsSet(EV_PREFIX + id, js);
    lastJs[id] = js;
    const e = entOf(id); if(e){ Object.assign(e, evMeta(st)); saveIndex(); }

function clQueuePub(id, ms){
  clearTimeout(CL.pubT[id]);
  CL.pubT[id] = setTimeout(()=>{ delete CL.pubT[id]; clPushPub(id); }, ms == null ? 1200 : ms);

async function clPushPub(id){
  const l = linkOf(id); if(!l || (l.role !== "own" && l.role !== "edit") || !CL.db) return;
  if(!CL.user){ clRefreshUI(); return; }
  if(CL.pubBusy[id]){ CL.pubAgain[id] = true; return; }
  if(id === LIB.current && saveT) flush();
  const base = getBase(id), P = shareProj(id === LIB.current ? S : loadEvent(id));
  if(base && eqJ(P, base.p)) return;
  CL.pubBusy[id] = true; CL.inflight++; clRefreshUI();
  try{
    const ref = pubRef(l.code); let out = null;
    await CL.F.runTransaction(CL.db, async tx=>{
      const snap = await tx.get(ref);
      if(!snap.exists() || snap.data().closed) throw {code:"bc/gone"};
      const d = snap.data();
      const R = (base && d.ver === base.v) ? null : sanitizeProj(await zDec(d));
      const merged = R ? merge3(base ? base.p : null, P, R) : P;
      const enc = await zEnc(merged);
      if(enc.size > 1000000) throw {code:"bc/big"};
      const v = (d.ver||0) + 1;
      tx.update(ref, {z:enc.z, c:enc.c, ver:v, upd:Date.now(), name:merged.event.name || ""});
      out = {v, p:merged};
    });
    const prev = getBase(id);
    if(!prev || (out.v||0) > (prev.v||0)) setBase(id, out);
    CL.pubInfo[id] = Object.assign(CL.pubInfo[id] || {}, {ver:out.v, upd:Date.now()});
    const nowP = shareProj(id === LIB.current ? S : loadEvent(id));
    if(!eqJ(out.p, nowP)) applyTo(id, merge3(P, nowP, out.p), prev ? prev.p : null, false);
    clQueueUser(id);
    CL.err = "";
  }catch(e){
    const c = e && e.code || "";
    if(c === "bc/gone"){ setLink(id, null); if(id === LIB.current){ clListenPub(); renderTop(); } toast("실시간 공유가 이미 끝난 행사예요"); }
    else if(/permission-denied/.test(c) && l.role === "edit"){ setLink(id, {role:"sub", code:l.code}); if(id === LIB.current){ clListenPub(); flush(); renderTop(); rerenderSoft(); } toast("편집 권한이 없어져서 구독으로 바뀌었어요"); }
    else { clErr(e, true); if(/unavailable|failed-precondition|network|aborted|deadline/.test(c)) clQueuePub(id, 15000); }
  }
  CL.pubBusy[id] = false; CL.inflight--; clRefreshUI();
  if(CL.pubAgain[id]){ CL.pubAgain[id] = false; clQueuePub(id, 300); }
}
async function clStartShare(){

function parseLive(raw){
  const s = String(raw || "").trim(), C = "([A-Za-z0-9]{8})", K = "([A-Za-z0-9]{12})";
  let m = s.match(new RegExp("(?:BCE-|[#&?]e=)" + C + "-" + K + "(?![A-Za-z0-9])", "i")); if(m) return {code:m[1].toUpperCase(), key:m[2].toUpperCase()};
  m = s.match(new RegExp("(?:BCL-|[#&?]s=)" + C + "(?![A-Za-z0-9])", "i")); if(m) return {code:m[1].toUpperCase()};
  return null;
}
function clHash(){
  const live = parseLive(location.hash); if(!live) return;
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  setTimeout(()=>{ if(live.key) clJoinEdit(live.code, live.key); else clSubscribe(live.code); }, 200);
}
async function clFetchPub(code){
  let snap;
  try{ snap = await CL.F.getDoc(pubRef(code)); }catch(e){ clErr(e); return null; }
  if(!snap.exists() || snap.data().closed){ toast("없는 코드이거나 공유가 끝난 행사예요"); return null; }
  const d = snap.data(); let R;
  try{ R = sanitizeProj(await zDec(d)); }catch(e){ toast("행사 데이터를 읽지 못했어요"); return null; }
  return {d, R};
}
function newLinkedEvent(R, ver, link){

  applyShared(st, R, null, link.role === "sub");

  const prev = LIB.current, pe = entOf(prev);
  const drop = pe && !pe.link && !pe.cu && isBlank(loadEvent(prev)) ? prev : null;
  const id = addEvent(st);
  setBase(id, {v:ver, p:R}); setLink(id, link);
  CL.dropAfter = drop;
  return id;
}

async function clEdLoad(quiet){

  try{
    const kref = CL.F.doc(CL.db, "pubkeys", code);

const LOCK_ITEM = new Set(["판매 형태", "작가", "하위 물품 추가", "이름 바꾸기", "가격 바꾸기", "하위 물품 삭제", "삭제", "물품 삭제"]);
const LOCK_BOOTH = new Set(["부스 삭제", "회전", "배치도에서 빼기", "배치도에 놓기"]);
function lockMenu(el, list){
  if(!list || !isSub()) return list;
  const bid = el.dataset.bid || el.dataset.id, b = bid && findBooth(bid); if(!b) return list;
  const iid = el.dataset.iid, i = iid && b.items.find(x=>x.id===iid);
  const ban = i ? (lockedItem(i) ? LOCK_ITEM : null) : (el.matches(".agrp[data-aid]") ? null : (lockedBooth(b) ? LOCK_BOOTH : null));
  if(!ban) return list;
  const out = list.filter(x=>!(x && x.label && ban.has(x.label)));
  return out.filter((x,k,a)=>!(x && x.sep && (k === a.length - 1 || (a[k+1] && a[k+1].sep))));
}

      S.cats.push(v); save(); renderInfo(); toast(`‘${v}’ 종류를 추가했어요`); break;
    }
    case "catup": { const i = +t.dataset.i; if(i<=0) return; [S.cats[i-1], S.cats[i]] = [S.cats[i], S.cats[i-1]]; save(); renderInfo(); break; }
    case "tagjump": { tagFilter = t.dataset.tag; secFilter = "all"; query = ""; setView("booths"); break; }
    case "tagdel": {
      const tg = t.dataset.tag, n = S.booths.filter(b=>b.tags.includes(tg)).length;
      if(await confirmBox(`‘#${tg}’ 태그를 지울까요?\n이 태그가 달린 부스 ${n}개에서 모두 빠져요. 부스는 지워지지 않아요.`, "삭제", true)){
        for(const b of S.booths) b.tags = b.tags.filter(x=>x!==tg);
        if(tagFilter===tg) tagFilter = null; save(); renderInfo(); toast(`‘#${tg}’ 태그를 지웠어요`);
      }
      break;
    }
    case "catdel": {
      const c = t.dataset.cat; let n = 0; for(const b of S.booths) for(const i of b.items) if(i.cat===c) n++;
      if(await confirmBox(n ? `‘${c}’ 종류를 지울까요?\n이 종류로 고른 물품 ${n}개는 ‘종류 없음’이 돼요.` : `‘${c}’ 종류를 지울까요?`, "삭제", true)){
        S.cats = S.cats.filter(x=>x!==c); for(const b of S.booths) for(const i of b.items) if(i.cat===c) i.cat = "";
        if(lastCat===c) lastCat = ""; if(ckCat===c) ckCat = null; save(); renderInfo();
      }
      break;
    }
    case "mode": ckMode = t.dataset.mode; document.querySelectorAll("#seg button").forEach(x=>x.setAttribute("aria-pressed", String(x===t))); renderCheckList(); break;
    case "nomaybe": ckNoMaybe = !ckNoMaybe; t.setAttribute("aria-pressed", String(ckNoMaybe)); renderCheckList(); break;
    case "dlsort": ckDl = !ckDl; t.setAttribute("aria-pressed", String(ckDl)); renderCheckList(); break;
    case "remain": ckRemain = !ckRemain; t.setAttribute("aria-pressed", String(ckRemain)); renderCheckList(); break;
    case "schadd": {
      const ti = document.getElementById("newTime"), tx = document.getElementById("newSch");
      const tm = normTime(ti.value);
      if(!tm){ toast("시간을 09:00처럼 24시간제로 적어 주세요"); ti.focus(); return; }
      if(!tx.value.trim()){ toast("일정 내용을 적어 주세요"); tx.focus(); return; }
      S.event.schedule.push({id:uid(), time:tm, text:tx.value.trim()});
      save(); tx.value = ""; ti.value = ""; renderSchList(); renderTop(); ti.focus();
      break;
    }
    case "schdel": {
      const x = S.event.schedule.find(y=>y.id===t.dataset.sid); if(!x) return;
      if(await confirmBox(`${x.time} ${x.text} 일정을 지울까요?`, "삭제", true)){
        S.event.schedule = S.event.schedule.filter(y=>y!==x); save(); renderSchList(); renderTop();
      }
      break;
    }
    case "secadd": {
      const inp = document.getElementById("newSec"); const v = inp.value.trim();
      if(!v){ inp.focus(); return; }
      if(S.sections.includes(v)){ toast("이미 있는 구역이에요"); return; }
      S.sections.push(v); save(); renderInfo(); toast(`${v} 구역을 추가했어요`); break;
    }
    case "secup": {
      const i = +t.dataset.i; if(i<=0) return;
      [S.sections[i-1], S.sections[i]] = [S.sections[i], S.sections[i-1]]; save(); renderInfo(); break;
    }
    case "secdel": {
      const s = t.dataset.sec; const n = S.booths.filter(b=>b.section===s).length;
      if(n){ toast(`${s} 구역에 부스 ${n}개가 있어요. 부스를 먼저 옮기거나 지워 주세요.`); return; }
      if(await confirmBox(`${s} 구역을 지울까요?`, "삭제", true)){ S.sections = S.sections.filter(x=>x!==s); save(); renderInfo(); }
      break;
    }
    case "mkcode": {
      const code = await makeCode(shareOpts());
      const out = document.getElementById("codeOut");
      out.innerHTML = `<textarea class="inp out" id="codeTxt" readonly style="margin-top:12px">${esc(code)}</textarea>
        <div class="btnrow" style="margin-top:8px"><button class="btn" data-act="copycode">코드 복사</button></div>
        <p class="desc" style="margin:8px 0 0">${code.length.toLocaleString()}자 · 메신저 글자 수 제한에 걸리면 백업 파일로 보내세요.</p>`;
      copyText(code, document.getElementById("codeTxt"));
      break;
    }
    case "copycode": { const el = document.getElementById("codeTxt"); copyText(el.value, el); break; }
    case "import": await doImport(document.getElementById("codeIn").value); break;
    case "mktext": {
      const txt = makeText(shareOpts());
      if(!txt){ toast("공유할 내용이 아직 없어요"); return; }
      document.getElementById("textOut").innerHTML = `<textarea class="inp out" id="textTxt" readonly style="margin-top:12px;min-height:180px;font-family:var(--body);font-size:14px;word-break:keep-all">${esc(txt)}</textarea>
        <div class="btnrow" style="margin-top:8px"><button class="btn" data-act="copytext">글 복사</button></div>`;
      break;
    }
    case "copytext": { const el = document.getElementById("textTxt"); copyText(el.value, el); break; }
    case "download": {
      if(!downloads && !canBlobDl) return;
      const name = (S.event.name || "부스체크").replace(/[\\/:*?"<>|]/g,"").slice(0,40) + "-백업.json";
      if(!downloads){
        try{
          const url = URL.createObjectURL(new Blob([JSON.stringify(exportData(SHARE_ALL), null, 1)], {type:"application/json"}));
          const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=>URL.revokeObjectURL(url), 4000); toast("백업 파일을 저장했어요");
        }catch(err){ toast("파일을 저장하지 못했어요"); }
        break;
      }
      try{ await downloads.save({filename:name, data:JSON.stringify(exportData(SHARE_ALL), null, 1)}); toast("백업 파일을 저장했어요"); }
      catch(err){ if(err && err.code !== "declined") toast("파일을 저장하지 못했어요"); }
      break;
    }
    case "reset": {
      const nm = S.event.name || "이름 없는 행사";
      if(!await confirmBox(`‘${nm}’를 지울까요?\n부스, 물품, 체크 기록이 모두 사라지고 되돌릴 수 없어요.${clDelNote(LIB.current)}`, "삭제", true)) break;
      const id = LIB.current; clDeleted(id); setBase(id, null); delete lastJs[id]; clearTimeout(saveT); saveT = null;
      LIB.list = LIB.list.filter(x=>x.id!==id); lsDel(EV_PREFIX + id); delete memEvents[id];
      if(!LIB.list.length){ const nid = uid(), st = defaultState(); st.sections = [...S.sections]; st.cats = [...S.cats]; memEvents[nid] = st; lsSet(EV_PREFIX + nid, JSON.stringify(st)); LIB.list.push({id:nid, ...evMeta(st)}); }
      LIB.current = LIB.list[0].id; saveIndex(); S = loadEvent(LIB.current); resetUI(); clListenPub(); renderTop(); renderView();
      toast("행사를 지웠어요"); break;
    }
  }
});

/* inputs (search, event info, section rename) */
let qT;
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.id === "q"){ clearTimeout(qT); qT = setTimeout(()=>{ query = t.value.trim(); renderBoothList(); }, 120); }
  else if(t.dataset.ev){ S.event[t.dataset.ev] = t.value; save(); renderTop(); }
  else if(t.dataset.sch === "text"){ const x = S.event.schedule.find(y=>y.id===t.dataset.sid); if(x){ x.text = t.value; save(); renderTop(); } }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset.sch === "time"){
    const x = S.event.schedule.find(y=>y.id===t.dataset.sid);
    if(x){
      const tm = normTime(t.value);
      if(!tm){ toast("시간을 09:00처럼 24시간제로 적어 주세요"); t.value = x.time; return; }
      x.time = tm; save(); renderSchList(); renderTop();
    }
    return;
  }
  if(t.dataset.act === "tagname"){
    const old = t.dataset.old, v = cleanTag(t.value);
    if(!v || v === old){ t.value = old; return; }
    const exists = S.booths.some(b=>b.tags.includes(v));
    const go = ()=>{
      for(const b of S.booths) if(b.tags.includes(old)) b.tags = [...new Set(b.tags.map(x=>x===old ? v : x))];
      if(tagFilter===old) tagFilter = v;
      save(); renderInfo(); toast(exists ? `#${old} → #${v} 로 합쳤어요` : `#${old} → #${v}`);
    };
    if(exists) confirmBox(`‘#${v}’ 태그가 이미 있어요.\n‘#${old}’를 ‘#${v}’로 합칠까요?`, "합치기").then(ok=>{ if(ok) go(); else t.value = old; });
    else go();
    return;
  }
  if(t.dataset.act === "catname"){
    const old = t.dataset.old, v = t.value.trim().slice(0,20);
    if(!v || v === old){ t.value = old; return; }
    if(S.cats.includes(v)){ toast("이미 있는 종류 이름이에요"); t.value = old; return; }
    S.cats = S.cats.map(c=>c===old?v:c);
    for(const b of S.booths) for(const i of b.items) if(i.cat===old) i.cat = v;
    if(lastCat===old) lastCat = v; if(ckCat===old) ckCat = v;
    save(); renderInfo(); toast(`${old} → ${v}`); return;
  }
  if(t.dataset.act === "secname"){
    const old = t.dataset.old, v = t.value.trim();
    if(!v || v === old){ t.value = old; return; }
    if(S.sections.includes(v)){ toast("이미 있는 구역 이름이에요"); t.value = old; return; }
    S.sections = S.sections.map(s=>s===old?v:s);
    S.booths.forEach(b=>{ if(b.section===old) b.section = v; });
    if(secFilter === old) secFilter = v;
    save(); renderTop(); renderInfo(); toast(`${old} → ${v}`);
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !imeBusy(e) && e.target.id==="newTime"){ e.preventDefault(); const tm = normTime(e.target.value); if(tm) e.target.value = tm; document.getElementById("newSch").focus(); return; }
  if(e.key==="Enter" && !imeBusy(e) && e.target.id==="newSch"){ e.preventDefault(); document.querySelector('[data-act="schadd"]').click(); return; }
  if(e.key==="Enter" && !imeBusy(e) && e.target.dataset && e.target.dataset.gnew){ e.preventDefault(); const b = document.querySelector(`[data-act="gadd"][data-pid="${e.target.dataset.gnew}"]`); if(b) b.click(); return; }
  if(e.key==="Enter" && !imeBusy(e) && e.target.id==="newCat"){ e.preventDefault(); document.querySelector('[data-act="catadd"]').click(); return; }
  if(e.key==="Enter" && !imeBusy(e) && e.target.id==="newSec"){ e.preventDefault(); document.querySelector('[data-act="secadd"]').click(); }
});

fab.addEventListener("click", ()=>{
  if(!S.sections.length){ toast("구역을 먼저 만들어 주세요"); setView("info"); return; }
  openSheet({kind:"boothForm", id:null});
});

(()=>{
  const v = document.getElementById("imgv"); let x0 = null, moved = 0;
  v.addEventListener("pointerdown", e=>{ if(!e.target.closest(".vform")){ x0 = e.clientX; moved = 0; } });
  v.addEventListener("pointerup", e=>{ if(x0 != null) moved = e.clientX - x0; x0 = null; });
  v.addEventListener("click", e=>{
    if(e.target.closest(".vform") || e.target.id === "imgvOpen") return;
    if(e.target.closest("[data-vx]")){ closeViewer(); return; }
    if(e.target.closest("[data-vw]")){ startWrite(); return; }
    const nv = e.target.closest("[data-vd]"); if(nv){ stepViewer(+nv.dataset.vd); return; }
    if(Math.abs(moved) > 40 && VW.list.length > 1 && !v.classList.contains("zoom")){ stepViewer(moved < 0 ? 1 : -1); moved = 0; return; }
    if(e.target.id === "imgvImg"){ v.classList.toggle("zoom"); return; }
    if(!v.classList.contains("write")) closeViewer();
  });
  document.addEventListener("keydown", e=>{
    if(!v.classList.contains("show")) return;
    if(e.key === "Escape"){ closeViewer(); e.stopPropagation(); return; }
    if(e.target.closest && e.target.closest(".vform")) return;
    if(e.key === "ArrowRight"){ stepViewer(1); e.preventDefault(); }
    else if(e.key === "ArrowLeft"){ stepViewer(-1); e.preventDefault(); }
  }, true);
})();

/* 모바일: 아래로 스크롤하면 헤더를 접음 */
(()=>{
  const mq = window.matchMedia("(max-width:559px)");
  let mini = false;
  main.addEventListener("scroll", ()=>{
    if(!mq.matches){ if(mini){ mini = false; document.getElementById("top").classList.remove("mini"); } return; }
    const y = main.scrollTop, want = mini ? y > 8 : y > 70;
    if(want !== mini){ mini = want; document.getElementById("top").classList.toggle("mini", mini); }
  }, {passive:true});
})();
/* boot */
renderTop();
setView("booths");
clInit();
})();
</script>
