<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 보안 정책: 로그인(Google 팝업)·Firebase·외부 이미지 링크를 깨지 않는 범위만 막음. script-src까지 막으려면 로그인 동작을 실제로 확인한 뒤에 -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1D3A" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="부스 체크" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>부스 체크</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app">
      <header class="top" id="top"></header>
      <main id="main"></main>
      <nav class="tabbar" role="tablist">
        <button class="tab" role="tab" data-tab="booths" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" /></svg
          >부스
        </button>
        <button class="tab" role="tab" data-tab="map" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M3 10h7v11M14 3v7h7M14 15h4" /></svg
          >배치도
        </button>
        <button class="tab" role="tab" data-tab="check" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6h11M9 12h11M9 18h11" />
            <path d="M3.5 6l1.5 1.5L7.5 4.5M3.5 12l1.5 1.5 2.5-3M3.5 18l1.5 1.5 2.5-3" /></svg
          >체크
        </button>
        <button class="tab" role="tab" data-tab="people" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="8" r="3.5" />
            <path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5" />
            <path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.8 3.1 2.6 3.5 5.2" /></svg
          >지인
        </button>
        <button class="tab" role="tab" data-tab="evtab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M3 10h18M8 3v4M16 3v4" />
            <path d="M12 13.5l1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z" /></svg
          >행사
        </button>
      </nav>
    </div>
    <button class="fab" id="fab" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <path d="M12 5v14M5 12h14" /></svg
      >부스 추가
    </button>
    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
    <div class="dlg" id="dlg">
      <div class="dlg-box">
        <p id="dlgMsg"></p>
        <input class="inp" id="dlgIn" style="display: none" />
        <div class="btnrow"><button class="btn ghost" id="dlgNo">취소</button><button class="btn" id="dlgYes">확인</button></div>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="imgv" id="imgv" role="dialog" aria-label="인포 이미지">
      <div class="vstage" id="vStage">
        <button class="x" type="button" data-vx aria-label="닫기">×</button>
        <span class="vcnt" id="imgvCnt"></span>
        <button class="vnav prev" type="button" data-vd="-1" aria-label="이전 이미지">‹</button>
        <div class="vimgwrap" id="vImgWrap"><img id="imgvImg" alt="" /></div>
        <button class="vnav next" type="button" data-vd="1" aria-label="다음 이미지">›</button>
        <div class="vbar">
          <a id="imgvOpen" target="_blank" rel="noopener noreferrer">원본 ↗</a
          ><button type="button" id="imgvWrite" data-vw>✎ 보면서 물품 적기</button>
        </div>
      </div>
      <div class="vform" id="vForm"></div>
    </div>
    <div class="ctx" id="ctx" role="menu"></div>

    <script>
      window.__bcCfg = { state: "loading" };
      addEventListener(
        "error",
        function (e) {
          var t = e && e.target;
          if (e && e.filename && /firebase-config\.js/.test(e.filename)) window.__bcCfg.state = "syntax";
          else if (t && t.id === "fbCfgJs") window.__bcCfg.state = "missing";
        },
        true
      );
    </script>
    <script src="firebase-config.js" id="fbCfgJs"></script>
    <script>
      if (window.__bcCfg.state === "loading") window.__bcCfg.state = "ok";
    </script>
    <script src="js/state.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/views.js"></script>
    <script src="js/map.js"></script>
    <script src="js/sheet.js"></script>
    <script src="js/menus.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/cloud.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
